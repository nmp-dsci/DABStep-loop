# Self-hosted MLflow for dev. `make mlflow-up` runs the same server without
# Docker; this is the containerised alternative. Port 5600: 5000 and 5500 are
# taken by sibling projects on this machine.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0
    command: >
      mlflow server --host 0.0.0.0 --port 5600
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5600:5600"]
    volumes: [".mlflow:/mlflow"]
