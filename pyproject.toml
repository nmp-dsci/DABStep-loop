[project]
name = "dabstep-loop"
version = "0.1.0"
description = "A Claude Agent SDK agent for the DABstep benchmark, with a scored, tracked, self-improving eval loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "claude-agent-sdk>=0.2.152",
  "anthropic>=0.71",
  "datasets>=3.0",
  "huggingface_hub>=0.30",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=17",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "rich>=13.9",
  "mlflow>=3.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.scripts]
dabstep = "dabstep_loop.cli:app"

[project.optional-dependencies]
lenses = [
    "scikit-learn>=1.5",
    "sentence-transformers>=3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.14.2",
  "mypy>=1.13",
  "types-PyYAML",
  "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dabstep_loop"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/dabstep_loop/eval/scorer.py"]  # vendored verbatim from adyen/DABstep

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dabstep_loop"]
mypy_path = "src"
exclude = ["src/dabstep_loop/eval/scorer.py"]

[[tool.mypy.overrides]]
module = ["dabstep_loop.eval.scorer", "mlflow.*", "datasets.*", "claude_agent_sdk.*", "sse_starlette.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -p no:warnings"

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sklearn.*"]
ignore_missing_imports = true
